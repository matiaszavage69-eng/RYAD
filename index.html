<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryad Lux</title>
<meta name="description" content="Catálogo Ryad Lux: zapatillas, ropa, accesorios y sunglasses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">Ryad Lux</h1>
    <p class="season">Catálogo · Colección 2026</p>
  </header>
  <p class="notice">Catálogo en construcción. Los datos marcados como "por confirmar" se completan en la siguiente actualización.</p>

  <div class="who" id="who" role="group" aria-label="Sección del catálogo"></div>
  <div class="tools">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por público"></div>
    <input class="search" id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
  </div>
  <p class="count" id="count"></p>
  <main class="grid" id="grid"></main>
  <footer><span>Precios en soles (S/). Stock sujeto a disponibilidad.</span><span>Catálogo actualizado: octubre 2026</span><button type="button" class="adm-link" id="admLink">Admin</button></footer>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
